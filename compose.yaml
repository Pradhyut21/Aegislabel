services:
  db:
    image: postgres:16.8-bookworm
    environment:
      POSTGRES_DB: aegis
      POSTGRES_USER: aegis
      POSTGRES_PASSWORD: local-synthetic-only
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aegis"]
      interval: 3s
      timeout: 3s
      retries: 20
  app:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://aegis:local-synthetic-only@db:5432/aegis
      AI_ENABLED: "false"
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./artifacts:/app/artifacts
volumes:
  postgres-data:
