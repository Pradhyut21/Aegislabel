name: Quality
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.8-bookworm
        env:
          POSTGRES_USER: aegis
          POSTGRES_PASSWORD: local-synthetic-only
          POSTGRES_DB: aegis_test
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U aegis"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.lock.txt
      - run: python -m scripts.check_repository
      - run: ruff check backend tests scripts && ruff format --check backend tests scripts
      - run: python -m pytest -q
      - run: python -m pytest -q
        env:
          TEST_DATABASE_URL: postgresql+psycopg://aegis:local-synthetic-only@127.0.0.1:5432/aegis_test
      - run: alembic upgrade head && alembic current
      - run: python -m scripts.benchmark
      - run: python -m scripts.export_openapi && git diff --exit-code docs/openapi.json
      - run: pip-audit --progress-spinner off
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.18.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run typecheck && npm run lint && npm run format:check && npm test && npm run build
        working-directory: frontend
      - run: npm run api:types && git diff --exit-code src/generated/api.d.ts
        working-directory: frontend
      - run: npm audit --audit-level=moderate
        working-directory: frontend
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.18.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python -m pip install -r requirements.lock.txt
      - run: npm ci && npm run build && npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Run actual warning workflow and accessibility checks
        env:
          AI_ENABLED: 'false'
          DATABASE_URL: sqlite:///./artifacts/ci-browser.db
        run: |
          uvicorn backend.main:app --host 127.0.0.1 --port 8000 --workers 1 > artifacts/server.log 2>&1 &
          trap 'kill $!' EXIT
          curl --retry 15 --retry-all-errors --retry-delay 1 --connect-timeout 3 --max-time 5 --fail http://127.0.0.1:8000/api/v1/health
          cd frontend
          npm run test:e2e
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: browser-test-summary
          path: artifacts/playwright-results.json
          if-no-files-found: ignore
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - run: docker build -t aegislabel-fx:ci .
      - name: Smoke-test local container
        run: |
          docker run -d --name aegis-ci -p 127.0.0.1:8000:8000 aegislabel-fx:ci
          trap 'docker logs aegis-ci; docker rm -f aegis-ci' EXIT
          curl --retry 20 --retry-all-errors --retry-delay 2 --connect-timeout 3 --max-time 5 --fail http://127.0.0.1:8000/api/v1/health
